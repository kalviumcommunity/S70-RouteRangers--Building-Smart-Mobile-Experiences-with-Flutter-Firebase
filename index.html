<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteHive 🐝 — Community Safety Navigation</title>
  <script>
    if (window.location.pathname === '/' || window.location.pathname === '/index.html') {
      window.location.replace('/build/web/index.html');
    }
  </script>
  <meta http-equiv="refresh" content="0; url=/build/web/index.html">
</head>
<body>
  <div style="font-family: sans-serif; text-align: center; padding: 50px;">
    <h2>RouteHive 🐝</h2>
    <p>Redirecting to web app...</p>
    <p><a href="/build/web/index.html">Click here if not redirected automatically</a></p>
  </div>
</body>
</html>
